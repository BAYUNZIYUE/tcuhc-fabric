name: Build or Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a GitHub Release after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-or-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate version
        id: version
        run: python scripts/validate_release.py --github-output "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        if: inputs.create_release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi

      - name: Run repository tests
        run: python tests/run_all.py

      - name: Compile and package
        run: ./gradlew clean build

      - name: Validate release artifacts
        run: python scripts/validate_release.py --artifacts

      - name: Smoke-test dedicated server startup
        run: python tests/smoke_server.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcuhc-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.version.outputs.sources_jar }}
          retention-days: 14

      - name: Publish GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          SOURCES_JAR: ${{ steps.version.outputs.sources_jar }}
        run: >-
          gh release create "$TAG" "$JAR" "$SOURCES_JAR"
          --target "$GITHUB_SHA"
          --title "TC UHC $TAG"
          --generate-notes
