plugins {
	id 'fabric-loom' version '1.7.1'
	id 'maven-publish'
}

repositories {
	maven {
		url 'https://masa.dy.fi/maven'
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://www.cursemaven.com'
	}
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = 'mc' + project.minecraft_version + '-' + project.mod_version
group = project.maven_group

def fabricApiModules = [
        "fabric-api-base",
        "fabric-biome-api-v1",
        "fabric-resource-loader-v0",
        "fabric-lifecycle-events-v1",
]

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// lazydfu (a dev-only DataFixerUpper startup optimisation) is removed: it is a 2020 mod for
	// 1.16 and does not work on 1.21.1. Two separate failures, both fatal to `gradlew runServer`:
	//   1. it still declares fabric-loader 0.10.8, which Gradle pulls in transitively and Loom
	//      remaps as a mod -> "duplicate fabric loader classes found on classpath", Knot refuses
	//      to start. Survivable with an exclude.
	//   2. its SchemasMixin @Redirect targets Schemas.method_15471(), which no longer exists ->
	//      "Critical injection failure ... could not find any targets", server dies on boot.
	//      Not survivable.
	// It was modRuntimeOnly, so it never shipped in the jar and nothing in the mod depends on it.
	// modRuntimeOnly 'com.github.astei:lazydfu:0.1.2'

	fabricApiModules.each {
		modImplementation fabricApi.module(it, project.fabric_api_version)
		include fabricApi.module(it, project.fabric_api_version)
	}
}

loom {
	accessWidenerPath = file("src/main/resources/tcuhc.accesswidener")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	archiveClassifier = "sources"
	from sourceSets.main.allSource
}

jar {
	from "LICENSE"
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
